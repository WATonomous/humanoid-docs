<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" style="color:#16201c;font-family:'IBM Plex Sans',Helvetica,Arial,sans-serif" aria-label="One finger's cables. Four motors in the forearm each pull one cable: f1 ends on the spread yoke at the knuckle and pulls the spread against a spring; f2 runs over the MCP to the proximal link and flexes the MCP; f3 runs on the palm side over the MCP, PIP and DIP to the fingertip and curls; f4 runs on the back over the same joints and straightens. A closed cross-cable between the PIP and DIP knuckles holds DIP equal to PIP. Below, seen from the palm: the spread cable and the spring ending on the yoke's two arms, beside the alternative considered, a differential pair ending on the proximal link."><rect width="1000" height="640" fill="#ffffff"/>
  <defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#16201c"/></marker></defs>
  <text x="20" y="28" font-size="15" font-weight="600" fill="#16201c">One finger, side view, palm side down</text>
  <rect x="20" y="70" width="140" height="170" rx="6" fill="#eef1ef" stroke="#16201c" stroke-width="1.2"/>
  <text x="90" y="258" font-size="12" text-anchor="middle" fill="#16201c">forearm: 4 motors,</text>
  <text x="90" y="273" font-size="12" text-anchor="middle" fill="#16201c">one spool and cable each</text>
  <g font-size="12" fill="#16201c" text-anchor="middle">
    <circle cx="120" cy="96" r="12" fill="#fff" stroke="#7a4fb5" stroke-width="2"/><text x="62" y="100">f4</text>
    <circle cx="120" cy="134" r="12" fill="#fff" stroke="#1d8a5a" stroke-width="2"/><text x="62" y="138">f3</text>
    <circle cx="120" cy="172" r="12" fill="#fff" stroke="#d9771f" stroke-width="2"/><text x="62" y="176">f2</text>
    <circle cx="120" cy="210" r="12" fill="#fff" stroke="#2a6fb0" stroke-width="2"/><text x="62" y="214">f1</text>
  </g>
  <line x1="195" y1="60" x2="195" y2="250" stroke="#16201c" stroke-width="1" stroke-dasharray="4 4" opacity=".5"/>
  <text x="195" y="270" font-size="12" text-anchor="middle" fill="#16201c" opacity=".7">wrist</text>
  <rect x="225" y="128" width="170" height="44" rx="6" fill="#f2f2f2" stroke="#16201c" stroke-width="1.2"/>
  <text x="300" y="155" font-size="12" text-anchor="middle" fill="#16201c">palm</text>
  <rect x="398" y="136" width="20" height="28" rx="3" fill="#e8eef6" stroke="#16201c" stroke-width="1.2"/>
  <text x="408" y="128" font-size="10" text-anchor="middle" fill="#16201c" opacity=".7">yoke</text>
  <rect x="434" y="134" width="142" height="32" rx="5" fill="#fff" stroke="#16201c" stroke-width="1.2"/>
  <rect x="604" y="134" width="114" height="32" rx="5" fill="#fff" stroke="#16201c" stroke-width="1.2"/>
  <path d="M742 134 H830 A16 16 0 0 1 830 166 H742 Z" fill="#fff" stroke="#16201c" stroke-width="1.2"/>
  <text x="505" y="155" font-size="11" text-anchor="middle" fill="#16201c" opacity=".7">proximal</text>
  <text x="662" y="131" font-size="10" text-anchor="middle" fill="#16201c" opacity=".7">middle</text>
  <text x="790" y="155" font-size="11" text-anchor="middle" fill="#16201c" opacity=".7">distal (tip)</text>
  <path d="M590 132 L730 168 A18 18 0 0 0 730 132 L590 168 A18 18 0 0 1 590 132 Z" fill="none" stroke="#e0569b" stroke-width="2.6"/>
  <g fill="#fff" stroke="#16201c" stroke-width="1.4">
    <circle cx="426" cy="150" r="9"/><circle cx="590" cy="150" r="10"/><circle cx="730" cy="150" r="10"/>
  </g>
  <g font-size="12" font-weight="600" text-anchor="middle" fill="#16201c">
    <text x="426" y="74">MCP</text><text x="590" y="74">PIP</text><text x="730" y="74">DIP</text>
  </g>
  <polyline points="132,96 205,118 812,118 812,134" fill="none" stroke="#7a4fb5" stroke-width="2.2"/><circle cx="812" cy="134" r="4" fill="#7a4fb5"/>
  <text x="232" y="110" font-size="12" fill="#7a4fb5" font-weight="600">f4 straightens: over MCP, PIP, DIP, ends on the tip</text>
  <polyline points="132,134 205,180 812,180 812,166" fill="none" stroke="#1d8a5a" stroke-width="2.2"/><circle cx="812" cy="166" r="4" fill="#1d8a5a"/>
  <text x="600" y="198" font-size="12" fill="#1d8a5a" font-weight="600">f3 curls: over MCP, PIP, DIP, ends on the tip</text>
  <polyline points="132,172 205,190 520,190 520,166" fill="none" stroke="#d9771f" stroke-width="2.2"/><circle cx="520" cy="166" r="4" fill="#d9771f"/>
  <polyline points="132,210 205,200 404,200 404,164" fill="none" stroke="#2a6fb0" stroke-width="2.2"/><circle cx="404" cy="164" r="4" fill="#2a6fb0"/>
  <path d="M300 214 l6 -8 l6 8 l6 -8 l6 8 l6 -8 l6 8 l6 -8 l6 8 l6 -8 l6 8 l6 -8 l6 8 L412 206 L412 164" fill="none" stroke="#c81e4b" stroke-width="2"/>
  <circle cx="300" cy="214" r="3.5" fill="#c81e4b"/><circle cx="412" cy="164" r="3.5" fill="#c81e4b"/>
  <text x="232" y="232" font-size="12" fill="#16201c"><tspan fill="#2a6fb0" font-weight="600">f1</tspan> to the spread yoke, against the <tspan fill="#c81e4b" font-weight="600">spring</tspan> (palm to yoke)</text>
  <text x="232" y="248" font-size="12" fill="#16201c"><tspan fill="#d9771f" font-weight="600">f2</tspan>: over the MCP only, ends on the proximal link</text>
  <line x1="660" y1="250" x2="676" y2="160" stroke="#e0569b" stroke-width="1" opacity=".8"/>
  <text x="660" y="266" font-size="12" fill="#e0569b" font-weight="600" text-anchor="middle">cross-cable: closed loop, no motor</text>
  <text x="660" y="281" font-size="12" fill="#e0569b" text-anchor="middle">holds DIP = PIP</text>

  <line x1="20" y1="305" x2="980" y2="305" stroke="#16201c" stroke-width=".6" opacity=".3"/>
  <text x="20" y="336" font-size="15" font-weight="600" fill="#16201c">Seen from the palm: the spread drive, and the alternative considered</text>
  <g transform="translate(0,20)">
    <text x="40" y="350" font-size="13" font-weight="600" fill="#16201c">Alternative: differential pair</text>
    <rect x="40" y="400" width="120" height="90" rx="6" fill="#f2f2f2" stroke="#16201c" stroke-width="1.2"/>
    <text x="100" y="449" font-size="12" text-anchor="middle" fill="#16201c">palm</text>
    <rect x="168" y="418" width="16" height="54" rx="3" fill="#e8eef6" stroke="#16201c" stroke-width="1.2"/>
    <circle cx="176" cy="445" r="5" fill="#16201c"/>
    <rect x="194" y="417" width="130" height="56" rx="6" fill="#fff" stroke="#16201c" stroke-width="1.2"/>
    <polyline points="20,413 300,425" fill="none" stroke="#2a6fb0" stroke-width="2.2"/><circle cx="300" cy="425" r="4" fill="#2a6fb0"/>
    <polyline points="20,477 300,465" fill="none" stroke="#d9771f" stroke-width="2.2"/><circle cx="300" cy="465" r="4" fill="#d9771f"/>
    <text x="40" y="392" font-size="12" fill="#2a6fb0" font-weight="600">T1</text>
    <text x="40" y="510" font-size="12" fill="#d9771f" font-weight="600">T2</text>
    <text x="40" y="534" font-size="12" fill="#16201c">Both end on the proximal link: together they curl the MCP,</text>
    <text x="40" y="550" font-size="12" fill="#16201c">their difference spreads the finger. Their spread arms</text>
    <text x="40" y="566" font-size="12" fill="#16201c">shrink as the MCP curls; it needs a centring spring.</text>
  </g>
  <g transform="translate(500,20)">
    <text x="40" y="350" font-size="13" font-weight="600" fill="#16201c">The hand's spread drive</text>
    <rect x="40" y="400" width="120" height="90" rx="6" fill="#f2f2f2" stroke="#16201c" stroke-width="1.2"/>
    <text x="100" y="449" font-size="12" text-anchor="middle" fill="#16201c">palm</text>
    <rect x="168" y="412" width="16" height="66" rx="3" fill="#e8eef6" stroke="#16201c" stroke-width="1.2"/>
    <circle cx="176" cy="445" r="5" fill="#16201c"/>
    <rect x="194" y="417" width="130" height="56" rx="6" fill="#fff" stroke="#16201c" stroke-width="1.2"/>
    <polyline points="20,416 176,418" fill="none" stroke="#2a6fb0" stroke-width="2.2"/><circle cx="176" cy="418" r="4" fill="#2a6fb0"/>
    <path d="M110 474 l5 6 l5 -6 l5 6 l5 -6 l5 6 l5 -6 l5 6 l5 -6 l5 6 l5 -6 L176 472" fill="none" stroke="#c81e4b" stroke-width="2"/>
    <circle cx="110" cy="474" r="3.5" fill="#c81e4b"/><circle cx="176" cy="472" r="3.5" fill="#c81e4b"/>
    <polyline points="20,452 300,452" fill="none" stroke="#d9771f" stroke-width="2.2"/><circle cx="300" cy="452" r="4" fill="#d9771f"/>
    <text x="40" y="392" font-size="12" fill="#2a6fb0" font-weight="600">f1</text>
    <text x="40" y="510" font-size="12" fill="#c81e4b" font-weight="600">spring</text>
    <text x="250" y="444" font-size="12" fill="#d9771f" font-weight="600">f2</text>
    <text x="40" y="534" font-size="12" fill="#16201c">f1 and the spring end on the yoke's two arms, before</text>
    <text x="40" y="550" font-size="12" fill="#16201c">the MCP: f1 steers the spread both ways at any curl.</text>
    <text x="40" y="566" font-size="12" fill="#16201c">f2 flexes the MCP on its own.</text>
  </g>
  <text x="20" y="625" font-size="12" fill="#16201c" opacity=".75">Not to scale. Per finger: 4 motor cables, the cross-cable loop and the spread spring.</text>
</svg>